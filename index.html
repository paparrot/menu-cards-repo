<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карточки меню: учим состав блюд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=PT+Serif:wght@400;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<header class="top"><button class="mt" id="menuToggle" aria-label="Открыть меню" aria-expanded="false" aria-controls="drawer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1>Состав блюд: карточки</h1></header>
<div class="layout"><aside id="drawer"><div class="dhead"><b>Меню</b><button class="mt" id="menuClose" aria-label="Закрыть меню"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="bar">
  <div class="seg" role="group" aria-label="Режим">
    <button id="m-fwd" aria-pressed="true">Блюдо → состав</button>
    <button id="m-rev" aria-pressed="false">Состав → блюдо</button>
  </div>
  <select id="batch" aria-label="Порция">
    <option value="0">Учить всё сразу</option>
    <option value="5">Порция: 5 новых блюд</option>
    <option value="10">Порция: 10 новых блюд</option>
  </select>
</div>
<div class="cats" id="cats" role="group" aria-label="Категории меню"></div>
<div class="tools">
  <label><input type="checkbox" id="onlyNew"> Только невыученные</label>
  <label><input type="checkbox" id="auto"> Озвучивать при перевороте</label>
  <button class="link" id="rate">Скорость: обычная</button>
  <span class="sp"></span>
  <button class="link" id="shuf">Перемешать</button>
  <button class="link" id="reset">Сбросить прогресс</button>
</div>
<details class="quiz bk" id="bk"><summary>Экспорт и импорт прогресса</summary><div class="qbody">
<div class="qmsg" style="color:var(--mute)">Прогресс хранится в этом браузере. Сохраните его в файл, чтобы перенести на другое устройство или не потерять при очистке данных сайта.</div>
<div class="qrow"><button class="qgo" id="bkexp">Экспорт в файл</button><button class="qgo" id="bkimp">Импорт из файла</button></div>
<input type="file" id="bkfile" accept=".json,.txt,application/json,text/plain" hidden>
<select id="bkmode" aria-label="Режим импорта"><option value="merge">При импорте: объединить с текущим</option><option value="replace">При импорте: заменить текущий</option></select>
<details class="bktxt" id="bktxt"><summary>Или скопировать текстом</summary><textarea id="bkt" rows="4" aria-label="Прогресс в виде текста"></textarea><div class="qrow"><button class="qgo" id="bkcopy">Копировать</button><button class="qgo" id="bkload">Восстановить</button></div></details>
<div class="qmsg" id="bkmsg" role="status" aria-live="polite"></div></div></details>
</aside><section>

<div class="prog"><i id="pb"></i></div>
<div class="meta"><span id="pos"></span><span id="known"></span></div>
<div id="stage"></div>
</section></div>

<div class="scrim" id="scrim"></div>
</main>
<script src="data/cards.js"></script>
<script src="js/app.js"></script>
<script src="js/telegram.js"></script>
</body>
</html>
